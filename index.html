<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Arena Strike — Prototype</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#080b10;font-family:Arial,sans-serif;color:#fff}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:20px;background:#1119;padding:10px 18px;border:1px solid #ffffff22;border-radius:12px;backdrop-filter:blur(8px)}.pill{font-size:14px}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:18px;height:2px;top:8px}.cross:after{width:2px;height:18px;left:8px}.bottom{position:absolute;left:20px;bottom:20px;background:#111b;padding:14px 16px;border:1px solid #ffffff22;border-radius:12px}.health{width:220px;height:12px;background:#333;border-radius:8px;overflow:hidden}.health i{display:block;height:100%;background:#40e080;width:100%}.hint{position:absolute;right:20px;bottom:20px;background:#111b;padding:12px 14px;border-radius:10px;border:1px solid #ffffff22;font-size:12px;line-height:1.6}.start{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#17243b,#05070b);z-index:5}.card{width:min(520px,90vw);padding:32px;border:1px solid #ffffff20;border-radius:20px;background:#0e131dcc;box-shadow:0 20px 80px #0008;text-align:center}.card h1{font-size:42px;margin:0 0 8px}.card p{color:#aeb8c9}.card button{margin-top:16px;border:0;border-radius:10px;padding:14px 28px;font-size:16px;font-weight:bold;cursor:pointer;background:#6d5cff;color:#fff}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#6d5cff22;color:#a99fff;font-size:12px}
</style>
</head>
<body>
<div class="start" id="start"><div class="card"><span class="tag">PHASE 1 PROTOTYPE</span><h1>ARENA STRIKE</h1><p>3D FPS prototype. Click start, then use WASD + mouse to move and aim. Left click fires the Assault Rifle.</p><button id="startBtn">ENTER ARENA</button></div></div>
<div id="hud"><div class="top"><div class="pill">WEAPON: <b>ASSAULT RIFLE</b></div><div class="pill">AMMO: <b id="ammo">30 / ∞</b></div><div class="pill">SCORE: <b id="score">0</b></div></div><div class="cross"></div><div class="bottom"><div>HEALTH</div><div class="health"><i id="health"></i></div></div><div class="hint">WASD Move · Mouse Aim · Click Shoot · R Reload · Shift Sprint</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080b10); scene.fog=new THREE.Fog(0x080b10,35,110);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,200); camera.position.set(0,2.1,8);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xaecbff,0x202020,2)); const sun=new THREE.DirectionalLight(0xffffff,3); sun.position.set(15,25,10); sun.castShadow=true; scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x252b34,roughness:.8})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const grid=new THREE.GridHelper(120,60,0x4d5663,0x303641); grid.position.y=.01; scene.add(grid);
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.7}));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;scene.add(m);return m}
box(0,2,-18,12,4,2,0x37404c); box(-18,2,-8,3,4,14,0x303844); box(18,2,-8,3,4,14,0x303844); box(-10,1.5,5,6,3,2,0x414b58); box(10,1.5,5,6,3,2,0x414b58); box(0,2,18,14,4,2,0x303844);
const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.9),new THREE.MeshStandardMaterial({color:0x161a20,metalness:.7,roughness:.3})); gun.position.set(.34,-.25,-.7); camera.add(gun); scene.add(camera);
const enemy=new THREE.Group(); const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.3,6,12),new THREE.MeshStandardMaterial({color:0xd64b4b})); body.position.y=1.2; body.castShadow=true; enemy.add(body); const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,16),new THREE.MeshStandardMaterial({color:0xf0b39a}));head.position.y=2.2;head.castShadow=true;enemy.add(head); enemy.position.set(0,0,-12);scene.add(enemy);
let keys={},yaw=0,pitch=0,locked=false,ammo=30,score=0,health=100,enemyHP=100,enemyDir=1,lastShot=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'){ammo=30;document.querySelector('#ammo').textContent=ammo+' / ∞'}}); addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=Math.max(-1.25,Math.min(1.25,pitch));camera.rotation.set(pitch,yaw,0,'YXZ')});
renderer.domElement.addEventListener('click',()=>{if(!locked)renderer.domElement.requestPointerLock();else shoot()});
function shoot(){const now=performance.now();if(now-lastShot<95||ammo<=0)return;lastShot=now;ammo--;document.querySelector('#ammo').textContent=ammo+' / ∞';gun.position.z=-.82;setTimeout(()=>gun.position.z=-.7,45);const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemy.children,true);if(hits.length){enemyHP-=25;if(enemyHP<=0){score++;document.querySelector('#score').textContent=score;enemyHP=100;enemy.position.set((Math.random()-.5)*28,0,-20-Math.random()*20)}}}
function update(dt){const speed=keys.ShiftLeft?12:7;const dir=new THREE.Vector3();if(keys.KeyW)dir.z-=1;if(keys.KeyS)dir.z+=1;if(keys.KeyA)dir.x-=1;if(keys.KeyD)dir.x+=1;dir.normalize();const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));camera.position.addScaledVector(forward,dir.z*speed*dt);camera.position.addScaledVector(right,dir.x*speed*dt);camera.position.x=Math.max(-26,Math.min(26,camera.position.x));camera.position.z=Math.max(-28,Math.min(28,camera.position.z));
enemy.position.x+=enemyDir*2.2*dt;if(Math.abs(enemy.position.x)>14)enemyDir*=-1;enemy.lookAt(camera.position.x,1.2,camera.position.z);if(enemy.position.distanceTo(camera.position)<5){health=Math.max(0,health-10*dt);document.querySelector('#health').style.width=health+'%';if(health<=0){health=100;camera.position.set(0,2.1,8);}}}
let prev=performance.now();function loop(t){const dt=Math.min(.05,(t-prev)/1000);prev=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelector('#startBtn').onclick=()=>{document.querySelector('#start').style.display='none';renderer.domElement.requestPointerLock()};
</script></body></html>
